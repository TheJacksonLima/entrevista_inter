# Infra local para rodar os três serviços à mão.
#   docker compose up -d
# Postgres: um servidor, três bancos (coordinator, reserve, merchant) — ver docker/postgres-init.
# Kafka: single node KRaft, acessível em localhost:9092.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

  kafka:
    image: apache/kafka-native:4.3.1
    ports:
      - "9092:9092"
