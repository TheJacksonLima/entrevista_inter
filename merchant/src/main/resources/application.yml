micronaut:
  application:
    name: piggies-merchant-service
  server:
    port: ${MERCHANT_PORT:8082}

datasources:
  default:
    url: ${MERCHANT_DB_URL:`jdbc:postgresql://localhost:5432/merchant`}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    db-type: postgres
    dialect: POSTGRES

jpa:
  default:
    properties:
      hibernate:
        hbm2ddl:
          auto: update

kafka:
  bootstrap:
    servers: ${KAFKA_BOOTSTRAP_SERVERS:`localhost:9092`}

# Tópico do evento (contrato: contracts/events/pagamento-confirmado.v1.schema.json)
spp:
  topics:
    pagamento-confirmado: piggies.pagamento-confirmado.v1
